<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Coloring Page — Scan & Watch</title>
  <meta name="description"
    content="Scan your coloring page to see it come alive with an animated video overlay using Augmented Reality." />

  <!-- A-Frame & MindAR Image Tracking — preload hints for faster fetch -->
  <link rel="preload" href="https://aframe.io/releases/1.6.0/aframe.min.js" as="script" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" as="script" crossorigin />
  <link rel="preload" href="./targets.mind" as="fetch" crossorigin />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* ── Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* Force hide A-Frame VR button */
    .a-enter-vr {
      display: none !important;
    }

    /* ── Loading / Splash overlay ── */
    #splash-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #09090b;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
    }

    #splash-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      animation: pulse-slow 3s ease-in-out infinite;
    }

    .splash-icon svg {
      width: 100%;
      height: 100%;
    }

    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%      { transform: scale(1.05); opacity: 1; }
    }

    .splash-title {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .splash-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 32px;
    }

    /* spinner */
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-status {
      margin-top: 18px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.3s;
    }

    /* ── Scanning HUD & Viewfinder ── */
    #scan-hud {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    #scan-hud.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      animation: blink 1.2s infinite ease-in-out;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }

    .hud-text {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
    }

    /* ── Viewfinder overlay ── */
    #scan-viewfinder {
      position: fixed;
      inset: 0;
      z-index: 990;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.35) 100%);
    }

    /* Viewfinder visible only when scanning HUD is visible */
    #scan-hud:not(.hidden)+#scan-viewfinder {
      opacity: 1;
    }

    .scanner-bracket {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 4px;
      animation: bracket-pulse 3s infinite ease-in-out;
    }

    .top-left {
      top: calc(50% - 140px);
      left: calc(50% - 140px);
      border-right: none;
      border-bottom: none;
    }

    .top-right {
      top: calc(50% - 140px);
      right: calc(50% - 140px);
      border-left: none;
      border-bottom: none;
    }

    .bottom-left {
      bottom: calc(50% - 140px);
      left: calc(50% - 140px);
      border-right: none;
      border-top: none;
    }

    .bottom-right {
      bottom: calc(50% - 140px);
      right: calc(50% - 140px);
      border-left: none;
      border-top: none;
    }

    .scanner-line {
      position: absolute;
      width: 280px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      animation: scan-move 4s infinite ease-in-out;
    }

    @keyframes bracket-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; border-color: #fff; }
    }

    @keyframes scan-move {
      0%, 100% { top: calc(50% - 140px); opacity: 0.1; }
      50% { top: calc(50% + 140px); opacity: 0.9; }
    }

    @media (max-width: 600px) {
      .top-left { top: calc(50% - 35vw); left: calc(50% - 35vw); }
      .top-right { top: calc(50% - 35vw); right: calc(50% - 35vw); }
      .bottom-left { bottom: calc(50% - 35vw); left: calc(50% - 35vw); }
      .bottom-right { bottom: calc(50% - 35vw); right: calc(50% - 35vw); }
      .scanner-line { width: 70vw; }
      @keyframes scan-move {
        0%, 100% { top: calc(50% - 35vw); opacity: 0.1; }
        50% { top: calc(50% + 35vw); opacity: 0.9; }
      }
    }

    /* ── Found badge ── */
    #found-badge {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(-60px);
      z-index: 1000;
      padding: 10px 24px;
      background: #ffffff;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #000000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    #found-badge.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── Record button (Shutter Ring style) ── */
    #record-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    #record-btn:active {
      transform: translateX(-50%) scale(0.92);
    }

    #record-btn .rec-inner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #record-btn.recording {
      border-color: #ffffff;
      animation: shutter-record-pulse 1.5s infinite ease-in-out;
    }

    #record-btn.recording .rec-inner {
      border-radius: 8px;
      transform: scale(0.5);
      background: #ffffff;
    }

    @keyframes shutter-record-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
      50%      { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
    }

    /* Recording timer */
    #rec-timer {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      color: #ffffff;
      letter-spacing: 1px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    #rec-timer .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b30;
      animation: blink 0.8s ease-in-out infinite;
      box-shadow: 0 0 8px #ff3b30;
    }

    /* ── Preview overlay ── */
    #preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }

    #preview-overlay.visible {
      display: flex;
    }

    #preview-video {
      max-width: 85%;
      max-height: 55vh;
      border-radius: 12px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 32px;
    }

    .preview-actions {
      display: flex;
      gap: 16px;
    }

    .preview-btn {
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .preview-btn:active {
      transform: scale(0.95);
    }

    .btn-share {
      background: #ffffff;
      color: #000000;
    }

    .btn-share:hover {
      background: #e5e5ea;
    }

    .btn-download {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-download:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-close {
      position: absolute;
      top: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-close:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(90deg);
    }
  </style>

  <!-- ── Smooth-tracking & Video-overlay A-Frame components ── -->
  <script>
    /* ──────────────────────────────────────────────────────────
     *  smooth-track — exponential smoothing on position & rotation
     *  Applies a lerp every tick so micro-jitter from the tracker
     *  is absorbed before it reaches the rendered entity.
     * ────────────────────────────────────────────────────────── */
    AFRAME.registerComponent('smooth-track', {
      schema: {
        factor: { type: 'number', default: 0.15 }   /* 0 = frozen, 1 = raw tracking */
      },

      init: function () {
        this._smoothPos = new THREE.Vector3();
        this._smoothQuat = new THREE.Quaternion();
        this._initialised = false;
      },

      tick: function () {
        const obj = this.el.object3D;
        const f = this.data.factor;

        if (!this._initialised) {
          this._smoothPos.copy(obj.position);
          this._smoothQuat.copy(obj.quaternion);
          this._initialised = true;
          return;
        }

        // Lerp position
        this._smoothPos.lerp(obj.position, f);
        obj.position.copy(this._smoothPos);

        // Slerp rotation
        this._smoothQuat.slerp(obj.quaternion, f);
        obj.quaternion.copy(this._smoothQuat);
      }
    });

    /* Global ref so the recording script knows which video is playing */
    window.__activeARVideo = null;

    AFRAME.registerComponent('video-overlay', {
      schema: {
        videoSelector: { type: 'string', default: '' }   /* e.g. "#ar-video-0" */
      },

      init: function () {
        const targetEntity = this.el;
        const videoSelector = this.data.videoSelector;
        const video = document.querySelector(videoSelector);
        const recordBtn = document.getElementById('record-btn');

        if (!video) {
          console.error('[video-overlay] No video found for selector:', videoSelector);
          return;
        }

        // When the image target is found → play its video with sound
        targetEntity.addEventListener('targetFound', () => {
          console.log('[AR] Target found — playing', videoSelector);
          document.getElementById('scan-hud').classList.add('hidden');

          const badge = document.getElementById('found-badge');
          badge.classList.add('visible');
          setTimeout(() => badge.classList.remove('visible'), 2400);

          // Pause any other active video first
          if (window.__activeARVideo && window.__activeARVideo !== video) {
            window.__activeARVideo.pause();
          }

          window.__activeARVideo = video;

          // Eagerly kick-start the video load if it hasn't begun yet
          if (video.preload === 'none') video.preload = 'auto';
          video.load();

          video.currentTime = 0;
          video.muted = false;
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch(err => {
              console.warn('Unmuted autoplay blocked, falling back to muted:', err);
              video.muted = true;
              video.play();
            });
          }

          // Show record button
          recordBtn.style.display = 'flex';
        });

        // When the image target is lost → pause its video
        targetEntity.addEventListener('targetLost', () => {
          console.log('[AR] Target lost —', videoSelector);
          video.pause();
          if (window.__activeARVideo === video) {
            window.__activeARVideo = null;
          }
          document.getElementById('scan-hud').classList.remove('hidden');
          recordBtn.style.display = 'none';
        });
      }
    });
  </script>
</head>

<body>
  <!-- ════════════  SPLASH / LOADING  ════════════ -->
  <div id="splash-overlay">
    <div class="splash-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
        <circle cx="12" cy="13" r="4" />
      </svg>
    </div>
    <div class="splash-title">AR Coloring</div>
    <div class="splash-sub">Initialising camera &amp; AR engine…</div>
    <div class="spinner"></div>
    <div class="splash-status" id="splash-status">Loading assets…</div>
  </div>

  <!-- ════════════  SCAN HUD  ════════════ -->
  <div id="scan-hud" class="hidden">
    <span class="hud-dot"></span>
    <span class="hud-text">Point camera at your coloring page</span>
  </div>

  <!-- ════════════  SCAN VIEW-FINDER  ════════════ -->
  <div id="scan-viewfinder">
    <div class="scanner-bracket top-left"></div>
    <div class="scanner-bracket top-right"></div>
    <div class="scanner-bracket bottom-left"></div>
    <div class="scanner-bracket bottom-right"></div>
    <div class="scanner-line"></div>
  </div>

  <!-- ════════════  FOUND BADGE  ════════════ -->
  <div id="found-badge">✨ Image Detected!</div>

  <!-- ════════════  RECORD BUTTON  ════════════ -->
  <div id="record-btn">
    <div class="rec-inner"></div>
  </div>

  <!-- ════════════  RECORDING TIMER  ════════════ -->
  <div id="rec-timer">
    <span class="rec-dot"></span>
    <span id="rec-time">0:00</span>
  </div>

  <!-- ════════════  PREVIEW OVERLAY  ════════════ -->
  <div id="preview-overlay">
    <button class="btn-close" id="preview-close">✕</button>
    <video id="preview-video" controls playsinline webkit-playsinline></video>
    <div class="preview-actions">
      <button class="preview-btn btn-share" id="btn-share">
        <span>📤</span> Share
      </button>
      <button class="preview-btn btn-download" id="btn-download">
        <span>💾</span> Save
      </button>
    </div>
  </div>

  <!-- ════════════  A-FRAME AR SCENE  ════════════ -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.00001; filterBeta: 0.5; warmupTolerance: 5; missTolerance: 5;"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false" loading-screen="enabled: false">
    <!-- ── Assets (52 videos) — injected by script below ── -->
    <a-assets id="ar-assets" timeout="1"></a-assets>

    <!-- ── Camera ── -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ── 52 AR target entities — injected by script below ── -->
  </a-scene>

  <!-- ════════════  Dynamic 52-target injection  ════════════ -->
  <script>
    (function () {
      const TOTAL_TARGETS = 52;
      const assetsEl = document.getElementById('ar-assets');
      const sceneEl = document.querySelector('a-scene');

      for (let i = 0; i < TOTAL_TARGETS; i++) {
        const num = i + 1;                       // 1-based file name
        const vid = document.createElement('video');
        vid.id = 'ar-video-' + i;
        vid.src = './videos/' + num + '.mp4';
        vid.setAttribute('preload', 'none');
        vid.setAttribute('loop', '');
        vid.setAttribute('crossorigin', 'anonymous');
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        assetsEl.appendChild(vid);

        const entity = document.createElement('a-entity');
        entity.id = 'ar-target-' + i;
        entity.setAttribute('mindar-image-target', 'targetIndex: ' + i);
        entity.setAttribute('video-overlay', 'videoSelector: #ar-video-' + i);
        entity.setAttribute('smooth-track', 'factor: 0.12');

        const aVideo = document.createElement('a-video');
        aVideo.setAttribute('src', '#ar-video-' + i);
        aVideo.setAttribute('position', '0 0 0.01');
        aVideo.setAttribute('width', '1');
        aVideo.setAttribute('height', '1.5');
        aVideo.setAttribute('rotation', '0 0 0');
        entity.appendChild(aVideo);

        sceneEl.appendChild(entity);
      }
    })();
  </script>

  <!-- ════════════  Boot-up + Recording script  ════════════ -->
  <script>
    (function () {
      const TOTAL_TARGETS = 52;

      /* ───── Boot-up ───── */
      const splash = document.getElementById('splash-overlay');
      const status = document.getElementById('splash-status');
      const scanHud = document.getElementById('scan-hud');
      const scene = document.querySelector('a-scene');

      scene.addEventListener('loaded', () => {
        status.textContent = 'Starting camera…';
      });

      scene.addEventListener('arReady', () => {
        status.textContent = 'AR ready!';
        setTimeout(() => {
          splash.classList.add('hidden');
          scanHud.classList.remove('hidden');
        }, 600);
      });

      scene.addEventListener('arError', () => {
        status.textContent = '⚠ Camera access denied — please allow camera.';
        status.style.color = '#f87171';
      });

      /* ───── Screen Recording ───── */
      const recordBtn = document.getElementById('record-btn');
      const recTimer = document.getElementById('rec-timer');
      const recTimeEl = document.getElementById('rec-time');
      const previewOverlay = document.getElementById('preview-overlay');
      const previewVideo = document.getElementById('preview-video');
      const btnShare = document.getElementById('btn-share');
      const btnDownload = document.getElementById('btn-download');
      const previewClose = document.getElementById('preview-close');

      // Collect all 52 AR video elements dynamically
      const allARVideos = [];
      for (let i = 0; i < TOTAL_TARGETS; i++) {
        allARVideos.push(document.getElementById('ar-video-' + i));
      }

      // Unlock audio on any screen interaction (bypasses mobile autoplay policies without a UI button)
      const unlockAudio = () => {
        allARVideos.forEach(v => {
          if (v && v.muted) v.muted = false;
        });
      };
      document.body.addEventListener('touchstart', unlockAudio, { passive: true });
      document.body.addEventListener('click', unlockAudio, { passive: true });

      let mediaRecorder = null;
      let recordedChunks = [];
      let recordingBlob = null;
      let timerInterval = null;
      let startTime = 0;

      function updateTimer() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = Math.floor(elapsed / 60);
        const secs = (elapsed % 60).toString().padStart(2, '0');
        recTimeEl.textContent = `${mins}:${secs}`;
      }

      let isRecording = false;
      let compositeCanvas = null;
      let compositeCtx = null;
      let drawRAF = null;

      function startRecording() {
        recordedChunks = [];
        isRecording = true;

        // ── 1. Locate the camera video element ──
        // MindAR inserts its own <video> for the camera feed — find it
        const cameraVideo = Array.from(document.querySelectorAll('video')).find(
          v => v !== previewVideo && !allARVideos.includes(v)
        );

        // ── 2. Prepare the composite (off-screen) canvas ──
        const aframeCanvas = scene.canvas;

        // Use a resolution that balances quality with performance.
        // On mobile the A-Frame canvas can be very large (devicePixelRatio);
        // cap at 1280 on the long side for a smooth recording.
        const maxDim = 1280;
        const scale = Math.min(1, maxDim / Math.max(aframeCanvas.width, aframeCanvas.height));
        const cW = Math.round(aframeCanvas.width  * scale);
        const cH = Math.round(aframeCanvas.height * scale);

        if (!compositeCanvas) {
          compositeCanvas = document.createElement('canvas');
        }
        compositeCanvas.width  = cW;
        compositeCanvas.height = cH;
        compositeCtx = compositeCanvas.getContext('2d', { alpha: false });
        // Disable image smoothing for speed — the source is already rendered
        compositeCtx.imageSmoothingEnabled = false;

        // ── 3. Pre-compute camera cover-fit values (only changes if orientation changes) ──
        let camSX = 0, camSY = 0, camSW = 0, camSH = 0;
        function updateCameraCrop() {
          if (!cameraVideo || cameraVideo.videoWidth === 0) return;
          const vW = cameraVideo.videoWidth;
          const vH = cameraVideo.videoHeight;
          const canvasRatio = cW / cH;
          const videoRatio  = vW / vH;
          if (videoRatio > canvasRatio) {
            // video is wider → crop sides
            camSH = vH;
            camSW = vH * canvasRatio;
            camSX = (vW - camSW) / 2;
            camSY = 0;
          } else {
            // video is taller → crop top/bottom
            camSW = vW;
            camSH = vW / canvasRatio;
            camSX = 0;
            camSY = (vH - camSH) / 2;
          }
        }
        updateCameraCrop();

        // ── 4. Efficient draw loop ──
        function drawFrame() {
          if (!isRecording) return;

          // Draw camera background (source-crop version — much faster than dest-scale)
          if (cameraVideo && cameraVideo.readyState >= 2) {
            if (camSW === 0) updateCameraCrop(); // first ready frame
            compositeCtx.drawImage(cameraVideo, camSX, camSY, camSW, camSH, 0, 0, cW, cH);
          }

          // Draw A-Frame 3D layer on top (includes the overlay video)
          compositeCtx.drawImage(aframeCanvas, 0, 0, cW, cH);

          drawRAF = requestAnimationFrame(drawFrame);
        }
        drawFrame();

        // ── 5. Build the recording stream ──
        const canvasStream = compositeCanvas.captureStream(0); // 0 = manual
        // Request a new frame each draw so captureStream stays in sync
        const videoTrack = canvasStream.getVideoTracks()[0];

        // Override drawFrame to also request a frame for the stream
        const origDraw = drawFrame;
        const syncedDraw = () => {
          if (!isRecording) return;

          if (cameraVideo && cameraVideo.readyState >= 2) {
            if (camSW === 0) updateCameraCrop();
            compositeCtx.drawImage(cameraVideo, camSX, camSY, camSW, camSH, 0, 0, cW, cH);
          }
          compositeCtx.drawImage(aframeCanvas, 0, 0, cW, cH);

          // Tell captureStream to grab this frame
          if (videoTrack.requestFrame) videoTrack.requestFrame();

          drawRAF = requestAnimationFrame(syncedDraw);
        };
        // Cancel the first loop and start the synced one
        cancelAnimationFrame(drawRAF);
        syncedDraw();

        // Audio — capture from the active AR video
        const activeVideo = window.__activeARVideo;
        if (activeVideo) {
          try {
            const vs = activeVideo.captureStream ? activeVideo.captureStream() : activeVideo.mozCaptureStream();
            vs.getAudioTracks().forEach(t => canvasStream.addTrack(t));
          } catch (e) {
            console.warn('Could not capture audio for recording:', e);
          }
        }

        // ── 6. Configure MediaRecorder with high quality ──
        const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs=avc1')
          ? 'video/mp4; codecs=avc1'
          : MediaRecorder.isTypeSupported('video/mp4')
            ? 'video/mp4'
            : MediaRecorder.isTypeSupported('video/webm;codecs=h264')
              ? 'video/webm;codecs=h264'
              : MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
                ? 'video/webm;codecs=vp9'
                : 'video/webm';

        const recorderOptions = {
          mimeType,
          videoBitsPerSecond: 8_000_000   // 8 Mbps — crisp quality
        };

        mediaRecorder = new MediaRecorder(canvasStream, recorderOptions);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const finalMime = mimeType.split(';')[0]; // clean mime for Blob
          recordingBlob = new Blob(recordedChunks, { type: finalMime });
          const url = URL.createObjectURL(recordingBlob);
          previewVideo.src = url;
          previewOverlay.classList.add('visible');
        };

        mediaRecorder.start(200); // 200 ms chunks — less overhead than 100 ms

        // UI
        recordBtn.classList.add('recording');
        recTimer.style.display = 'flex';
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 500);
      }

      function stopRecording() {
        isRecording = false;

        if (drawRAF) {
          cancelAnimationFrame(drawRAF);
          drawRAF = null;
        }

        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }

        // Hide recording UI
        recordBtn.classList.remove('recording');
        recTimer.style.display = 'none';
        clearInterval(timerInterval);
        recTimeEl.textContent = '0:00';
      }

      // Press and hold to record
      recordBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        startRecording();
      });

      recordBtn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        stopRecording();
      });

      recordBtn.addEventListener('pointerleave', (e) => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          stopRecording();
        }
      });

      // Prevent context menu on long press (mobile)
      recordBtn.addEventListener('contextmenu', (e) => e.preventDefault());

      // ── Share button ──
      btnShare.addEventListener('click', async () => {
        if (!recordingBlob) return;

        const ext = recordingBlob.type.includes('mp4') ? 'mp4' : 'webm';
        const file = new File([recordingBlob], `ar-recording.${ext}`, { type: recordingBlob.type });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'AR Coloring Page Recording',
              text: 'Check out this AR coloring page! ✨'
            });
          } catch (err) {
            if (err.name !== 'AbortError') {
              console.warn('Share failed:', err);
              // Fallback to download
              downloadRecording();
            }
          }
        } else {
          // Fallback: download if Web Share API not supported
          downloadRecording();
        }
      });

      // ── Download button ──
      function downloadRecording() {
        if (!recordingBlob) return;
        const ext = recordingBlob.type.includes('mp4') ? 'mp4' : 'webm';
        const url = URL.createObjectURL(recordingBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ar-recording.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      btnDownload.addEventListener('click', downloadRecording);

      // ── Close preview ──
      previewClose.addEventListener('click', () => {
        previewOverlay.classList.remove('visible');
        previewVideo.pause();
        previewVideo.src = '';
      });
    })();
  </script>
</body>

</html>
