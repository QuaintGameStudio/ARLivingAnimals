<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR Target Compiler — Combine All Pages</title>

    <!-- MindAR Image library (non-AFRAME build includes the Compiler) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>

    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        max-width: 600px;
        width: 100%;
        text-align: center;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #a78bfa, #818cf8, #6366f1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        font-size: 14px;
        color: rgba(255,255,255,0.55);
        margin-bottom: 32px;
      }

      /* Image preview grid */
      .image-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 28px;
      }

      .image-card {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        overflow: hidden;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      .image-card.loaded {
        border-color: rgba(16, 185, 129, 0.5);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
      }
      .image-card.error {
        border-color: rgba(248, 113, 113, 0.5);
      }

      .image-card img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        display: block;
      }

      .image-card .label {
        padding: 8px;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.7);
        text-align: center;
      }

      /* Progress bar */
      .progress-container {
        width: 100%;
        background: rgba(255,255,255,0.08);
        border-radius: 20px;
        overflow: hidden;
        height: 10px;
        margin-bottom: 12px;
        display: none;
      }
      .progress-container.visible { display: block; }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #818cf8, #a78bfa);
        border-radius: 20px;
        transition: width 0.3s ease;
      }

      .status-text {
        font-size: 14px;
        color: rgba(255,255,255,0.65);
        margin-bottom: 24px;
        min-height: 20px;
      }

      /* Compile button */
      .compile-btn {
        padding: 16px 40px;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #6366f1, #818cf8);
        box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        transition: transform 0.15s, opacity 0.2s;
      }
      .compile-btn:hover { transform: scale(1.03); }
      .compile-btn:active { transform: scale(0.97); }
      .compile-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .done-msg {
        margin-top: 20px;
        padding: 14px 24px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 12px;
        font-size: 14px;
        color: #10b981;
        display: none;
      }
      .done-msg.visible { display: block; }

      .log {
        margin-top: 24px;
        text-align: left;
        max-height: 200px;
        overflow-y: auto;
        font-size: 12px;
        color: rgba(255,255,255,0.45);
        background: rgba(0,0,0,0.25);
        border-radius: 10px;
        padding: 14px;
        font-family: 'SF Mono', 'Fira Code', monospace;
      }
      .log div { margin-bottom: 4px; }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🎯 Target Compiler</h1>
      <p class="subtitle">Compile all 6 page images into a single .mind file</p>

      <div class="image-grid" id="imageGrid"></div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="status-text" id="statusText">Loading images…</div>

      <button class="compile-btn" id="compileBtn" disabled>Compile Targets</button>

      <div class="done-msg" id="doneMsg">
        ✅ <strong>Done!</strong> The file <code>targets_combined.mind</code> has been downloaded.
        Place it in the project root folder alongside <code>index.html</code>.
      </div>

      <div class="log" id="log"></div>
    </div>

    <script>
      const PAGE_COUNT = 6;
      const pages = Array.from({ length: PAGE_COUNT }, (_, i) => ({
        name: `page${i + 1}`,
        imageSrc: `./page${i + 1}/image.png`,
      }));

      // Note: page4 has "Image.png" (capital I) — try both
      pages[3].imageSrcAlt = `./page4/Image.png`;

      const grid = document.getElementById('imageGrid');
      const statusText = document.getElementById('statusText');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const compileBtn = document.getElementById('compileBtn');
      const doneMsg = document.getElementById('doneMsg');
      const logEl = document.getElementById('log');

      function log(msg) {
        const d = document.createElement('div');
        d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Load all images
      const loadedImages = [];
      let loadedCount = 0;

      pages.forEach((page, idx) => {
        // Create card
        const card = document.createElement('div');
        card.className = 'image-card';
        card.id = `card-${idx}`;

        const img = document.createElement('img');
        img.alt = page.name;

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${page.name} — Loading…`;

        card.appendChild(img);
        card.appendChild(label);
        grid.appendChild(card);

        // Load image
        const imgObj = new Image();
        imgObj.crossOrigin = 'anonymous';

        imgObj.onload = () => {
          img.src = imgObj.src;
          card.classList.add('loaded');
          label.textContent = `${page.name} ✓`;
          loadedImages[idx] = imgObj;
          loadedCount++;
          log(`Loaded ${page.name} (${imgObj.naturalWidth}×${imgObj.naturalHeight})`);

          if (loadedCount === PAGE_COUNT) {
            statusText.textContent = 'All images loaded — ready to compile.';
            compileBtn.disabled = false;
          }
        };

        imgObj.onerror = () => {
          // Try alternative filename (capital I for page4)
          if (page.imageSrcAlt && imgObj.src.indexOf('Image.png') === -1) {
            log(`Failed to load ${page.imageSrc}, trying ${page.imageSrcAlt}…`);
            imgObj.src = page.imageSrcAlt;
            return;
          }
          card.classList.add('error');
          label.textContent = `${page.name} ✗ Failed`;
          log(`ERROR: Could not load ${page.name}`);
        };

        imgObj.src = page.imageSrc;
      });

      // Compile
      compileBtn.addEventListener('click', async () => {
        compileBtn.disabled = true;
        progressContainer.classList.add('visible');
        statusText.textContent = 'Compiling… This may take 30–60 seconds.';
        log('Starting compilation…');

        try {
          const compiler = new window.MINDAR.IMAGE.Compiler();

          const dataList = await compiler.compileImageTargets(loadedImages, (progress) => {
            const pct = Math.round(progress * 100);
            progressBar.style.width = pct + '%';
            statusText.textContent = `Compiling… ${pct}%`;
          });

          log('Compilation complete. Exporting .mind file…');
          statusText.textContent = 'Exporting…';

          const exportedBuffer = await compiler.exportData();

          // Download
          const blob = new Blob([exportedBuffer]);
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'targets_combined.mind';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          log(`Exported targets_combined.mind (${(blob.size / 1024).toFixed(1)} KB)`);
          statusText.textContent = 'Compilation complete!';
          progressBar.style.width = '100%';
          doneMsg.classList.add('visible');
        } catch (err) {
          log(`ERROR: ${err.message}`);
          statusText.textContent = `Error: ${err.message}`;
          compileBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
